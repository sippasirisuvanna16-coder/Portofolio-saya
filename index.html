<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .job-title {
            font-size: 14px;
            color: #007bff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-table td {
            padding: 8px 0;
            font-size: 14px;
        }

        .info-table td.label {
            font-weight: bold;
            color: #555;
            width: 35%;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="foto saya.jpg" alt="Foto Profile-img">
        <img src="https://placeholder.com" alt="Foto Profil" class="profile-img">
        
        <!-- Nama dan Pekerjaan -->
        <h1>Sippa Siri Suvanna</h1>
        <div class="job-title">Pelajar</div>
        
        <!-- Deskripsi Singkat -->
        <p class="bio">
            Halo! Saya adalah seorang antusias teknologi yang senang mempelajari hal baru, khususnya dalam bidang pengembangan web dan desain grafis.
        </p>

        <!-- Detail Informasi -->
        <table class="info-table">
            <tr>
                <td class="label">TTL</td>
                <td>:Kab.Semarang,10 Agustus 2009</td>
            </tr>
            <tr>
                <td class="label">Email</td>
                <td>: sippasirisuvanna16@gmail.com</td>
            </tr>
            <tr>
                <td class="label">Keahlian</td>
                <td>: HTML, CSS, JavaScript</td>
            </tr>
        </table>

        <!-- Tombol Aksi / Media Sosial -->
        <div class="social-links">
            <a href="#" class="btn">Hubungi Saya</a>
        </div>
    </div>

</body>
</html>
